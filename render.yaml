services:
  - type: web
    name: krishinova-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: krishinova
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false